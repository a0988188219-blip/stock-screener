<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>股票健檢</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F4; --surface:#FFFFFF; --ink:#17202B; --muted:#5E6A78; --line:#D5DBE2;
  --rise:#D0342C; --fall:#13865A;
  --hold:#2B4C9B; --watch:#B7791F; --exit:#4A5361;
  --hold-bg:#E3E9F7; --watch-bg:#F7EDDA; --exit-bg:#E2E5EA;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12171E; --surface:#1B222C; --ink:#E7ECF2; --muted:#93A0AF; --line:#2C3542;
  --rise:#F0645B; --fall:#3DBB85;
  --hold:#8FA9F0; --watch:#E2AE4E; --exit:#AAB3C0;
  --hold-bg:#1E2A47; --watch-bg:#3A2E17; --exit-bg:#2A313B;
}}
:root[data-theme="dark"]{
  --paper:#12171E; --surface:#1B222C; --ink:#E7ECF2; --muted:#93A0AF; --line:#2C3542;
  --rise:#F0645B; --fall:#3DBB85;
  --hold:#8FA9F0; --watch:#E2AE4E; --exit:#AAB3C0;
  --hold-bg:#1E2A47; --watch-bg:#3A2E17; --exit-bg:#2A313B;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:16px;line-height:1.6;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 48px}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
header h1{font-size:22px;font-weight:900;margin:0;letter-spacing:.02em}
header small{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;
  padding:9px 0;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--hold);outline-offset:2px}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border:1.5px solid var(--line);
  border-radius:10px;background:var(--surface);color:var(--ink)}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:0 18px;background:var(--ink);color:var(--paper);cursor:pointer}
.mine{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.mine button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:4px 12px;cursor:pointer}
.mine .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.hint{color:var(--muted);font-size:14px;margin:14px 0 0}
.result{margin-top:26px}
.name{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.name h2{margin:0;font-size:20px;font-weight:700}
.name .add{font:inherit;font-size:14px;border:0;background:none;color:var(--hold);cursor:pointer;padding:4px 0;white-space:nowrap}
.price{display:flex;align-items:baseline;gap:12px;margin:2px 0 14px}
.price b{font-size:34px;font-weight:700;letter-spacing:-.01em}
.up{color:var(--rise)} .down{color:var(--fall)}
.verdict{border-radius:14px;padding:16px 18px 18px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.verdict .word{font-size:46px;font-weight:900;line-height:1.05;grid-row:span 2}
.verdict p{margin:0;font-weight:500}
.verdict small{color:var(--muted);font-size:13px}
.v-hold{background:var(--hold-bg)} .v-hold .word{color:var(--hold)}
.v-watch{background:var(--watch-bg)} .v-watch .word{color:var(--watch)}
.v-exit{background:var(--exit-bg)} .v-exit .word{color:var(--exit)}
.chart{margin:18px 0 6px;background:var(--surface);border-radius:14px;padding:10px 6px 4px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:2px 10px 8px}
.legend i{display:inline-block;width:16px;border-top:2px solid;margin-right:6px;vertical-align:4px}
.cost{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 6px;font-size:15px}
.cost input{width:110px;font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.cost output{font-weight:700}
.checks{list-style:none;margin:20px 0 0;padding:0;border-top:1px solid var(--line)}
.checks li{display:grid;grid-template-columns:28px 3.2em 1fr;gap:4px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.checks .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900;color:var(--surface);margin-top:2px}
.checks b{font-weight:700}
.s-good .ic{background:var(--hold)} .s-warn .ic{background:var(--watch)}
.s-bad .ic{background:var(--exit)} .s-info .ic{background:var(--line);color:var(--muted)}
h3{font-size:17px;margin:28px 0 4px}
h3+p{color:var(--muted);font-size:14px;margin:0 0 8px}
.pick{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:0;
  border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer}
.pick .top{display:flex;justify-content:space-between;gap:8px}
.pick .top b{font-weight:700}
.pick .tags{font-size:14px;color:var(--muted);margin-top:2px}
.pick .lv{font-size:14px;margin-top:4px}
.empty{color:var(--muted);padding:6px 0}
footer{margin-top:36px;color:var(--muted);font-size:13px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.result{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>股票健檢</h1><small id="date">讀取中…</small></header>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="check">健檢</button>
    <button role="tab" aria-selected="false" data-tab="lists">今日名單</button>
  </div>

  <section id="tab-check">
    <form class="search" id="form">
      <input id="q" list="stocklist" inputmode="search" autocomplete="off" placeholder="輸入代號或名稱，例如 2330">
      <datalist id="stocklist"></datalist>
      <button class="btn" type="submit">健檢</button>
    </form>
    <div class="mine" id="mine"></div>
    <p class="hint" id="hint">輸入想看的股票。加入持股後，下次點一下就能看。</p>
    <div class="result" id="result" hidden></div>
  </section>

  <section id="tab-lists" hidden></section>

  <footer>這是用規則算出來的檢查結果，不是買賣建議。最後還是要對照 K 線圖自己判斷。</footer>
</div>

<script>
const $ = s => document.querySelector(s);
const fmt = n => n == null ? "—" : n.toLocaleString("zh-TW", {minimumFractionDigits:2, maximumFractionDigits:2});
const pct = n => (n > 0 ? "+" : "") + n.toFixed(1) + "%";
const cls = n => n > 0 ? "up" : n < 0 ? "down" : "";
const WORD = {hold:"續抱", watch:"留意", exit:"考慮出場"};
const ICON = {good:"✓", warn:"!", bad:"✕", info:"–"};
let DATA = null, current = null;

const store = {
  get(k, d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])) }

function findCode(q){
  q = q.trim(); if(!q) return null;
  const m = q.match(/^\d{4,6}/); if(m && DATA.stocks[m[0]]) return m[0];
  for(const [c, s] of Object.entries(DATA.stocks)) if(s.name && s.name === q) return c;
  for(const [c, s] of Object.entries(DATA.stocks)) if(s.name && s.name.includes(q)) return c;
  return null;
}

function chart(s){
  const W = 600, H = 230, P = {l:8, r:78, t:14, b:14};
  const vals = s.closes.filter(v => v != null);
  const extra = [s.support, s.resistance, ...s.ma20s.filter(v => v != null)].filter(v => v != null);
  let lo = Math.min(...vals, ...extra), hi = Math.max(...vals, ...extra);
  const pad = (hi - lo) * .06 || 1; lo -= pad; hi += pad;
  const x = i => P.l + i * (W - P.l - P.r) / (s.closes.length - 1);
  const y = v => P.t + (hi - v) * (H - P.t - P.b) / (hi - lo);
  const path = arr => arr.map((v,i) => v == null ? "" : `${i && arr[i-1] != null ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const level = (v, color, label) => v == null ? "" :
    `<line x1="${P.l}" x2="${W-P.r+4}" y1="${y(v)}" y2="${y(v)}" stroke="${color}" stroke-width="1.5" stroke-dasharray="6 5"/>
     <text x="${W-P.r+8}" y="${y(v)+4}" font-size="13" fill="${color}" font-weight="700">${label} ${fmt(v)}</text>`;
  const last = s.closes.length - 1;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="近 60 天股價走勢，含月線、支撐與壓力">
    <path d="${path(s.ma20s)}" fill="none" stroke="var(--muted)" stroke-width="1.5" opacity=".7"/>
    ${level(s.resistance, "var(--rise)", "壓力")}
    ${level(s.support, "var(--hold)", "支撐")}
    <path d="${path(s.closes)}" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${x(last)}" cy="${y(s.closes[last])}" r="4.5" fill="var(--ink)"/>
  </svg>`;
}

function costLine(s, cost){
  if(!cost) return "";
  const ret = (s.close / cost - 1) * 100;
  let t = `目前報酬 <span class="${cls(ret)}">${pct(ret)}</span>`;
  if(s.support){
    const atStop = (s.support / cost - 1) * 100;
    t += `，跌到支撐 ${fmt(s.support)} 時約 <span class="${cls(atStop)}">${pct(atStop)}</span>`;
  }
  return t;
}

function show(code){
  const s = DATA.stocks[code]; if(!s) return;
  current = code;
  location.hash = code;
  const mine = store.get("mine", []);
  const costs = store.get("costs", {});
  const inMine = mine.includes(code);
  const r = $("#result");
  r.innerHTML = `
    <div class="name"><h2>${code} ${esc(s.name || "")}</h2>
      <button class="add" id="toggle">${inMine ? "移出持股" : "＋ 加入持股"}</button></div>
    <div class="price"><b>${fmt(s.close)}</b><span class="${cls(s.chg)}">${pct(s.chg)}</span>
      <small style="color:var(--muted)">${s.date}</small></div>
    <div class="verdict v-${s.verdict}">
      <span class="word">${WORD[s.verdict]}</span>
      <p>${s.summary}</p>
      <small>${s.support ? "停損參考：跌破支撐 " + fmt(s.support) : "月線 " + fmt(s.ma20)}</small>
    </div>
    <div class="chart">${chart(s)}
      <div class="legend"><span><i style="border-color:var(--ink)"></i>股價</span>
        <span><i style="border-color:var(--muted)"></i>月線</span>
        <span><i style="border-color:var(--hold);border-top-style:dashed"></i>支撐</span>
        <span><i style="border-color:var(--rise);border-top-style:dashed"></i>壓力</span></div>
    </div>
    <label class="cost">成本價 <input id="cost" type="number" inputmode="decimal" step="0.01" value="${costs[code] ?? ""}" placeholder="選填">
      <output id="costOut">${costLine(s, costs[code])}</output></label>
    <ul class="checks">${s.checks.map(c => `<li class="s-${c.s}"><span class="ic">${ICON[c.s]}</span><b>${c.t}</b><span>${esc(c.d)}</span></li>`).join("")}</ul>`;
  r.hidden = false; $("#hint").hidden = true;
  $("#toggle").onclick = () => {
    let m = store.get("mine", []);
    m = m.includes(code) ? m.filter(c => c !== code) : [...m, code];
    store.set("mine", m); renderMine(); show(code);
  };
  $("#cost").oninput = e => {
    const v = parseFloat(e.target.value), c = store.get("costs", {});
    if(v > 0) c[code] = v; else delete c[code];
    store.set("costs", c);
    $("#costOut").innerHTML = costLine(s, v > 0 ? v : null);
  };
}

function renderMine(){
  const mine = store.get("mine", []).filter(c => DATA.stocks[c]);
  $("#mine").innerHTML = mine.map(c => {
    const s = DATA.stocks[c];
    return `<button data-code="${c}"><span class="dot" style="background:var(--${s.verdict})"></span>${c} ${esc(s.name || "")}</button>`;
  }).join("");
  $("#mine").querySelectorAll("button").forEach(b => b.onclick = () => show(b.dataset.code));
}

function pickHTML(p){
  return `<button class="pick" data-code="${p.code}">
    <div class="top"><b>${p.hot ? "🔥" : ""}${p.code} ${esc(p.name)}</b>
      <span>${fmt(p.close)} <span class="${cls(p.chg)}">${pct(p.chg)}</span></span></div>
    <div class="tags">${p.tags.map(esc).join("、")}</div>
    <div class="lv">支撐 ${fmt(p.support)}｜壓力 ${p.resistance ? fmt(p.resistance) : "無"}　${p.notes.map(esc).join("、")}</div>
  </button>`;
}

function renderLists(){
  const el = $("#tab-lists");
  el.innerHTML = `
    <h3>🚀 突破型</h3><p>剛帶量衝過壓力。🔥 是盤整突破。</p>
    ${DATA.picks.length ? DATA.picks.map(pickHTML).join("") : '<p class="empty">今天沒有符合條件的股票。</p>'}
    <h3>🔄 拉回支撐型</h3><p>本來在漲，回到支撐附近、量縮止跌。</p>
    ${DATA.pullbacks.length ? DATA.pullbacks.map(pickHTML).join("") : '<p class="empty">今天沒有拉回到支撐的強勢股。</p>'}`;
  el.querySelectorAll(".pick").forEach(b => b.onclick = () => { switchTab("check"); show(b.dataset.code); scrollTo(0,0); });
}

function switchTab(t){
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  $("#tab-check").hidden = t !== "check";
  $("#tab-lists").hidden = t !== "lists";
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => switchTab(b.dataset.tab));

$("#form").onsubmit = e => {
  e.preventDefault();
  const code = findCode($("#q").value);
  if(code){ show(code); $("#q").value = ""; $("#q").blur(); }
  else { $("#result").hidden = true; $("#hint").hidden = false;
    $("#hint").textContent = "找不到這檔。請輸入上市股票代號或名稱；上櫃股要先加進 GitHub 的持股清單才查得到。"; }
};

fetch("data.json", {cache:"no-store"}).then(r => { if(!r.ok) throw 0; return r.json() }).then(d => {
  DATA = d;
  $("#date").textContent = `資料日期 ${d.date.slice(5).replace("-","/")}`;
  $("#stocklist").innerHTML = Object.entries(d.stocks).map(([c,s]) => `<option value="${c} ${esc(s.name || "")}">`).join("");
  renderMine(); renderLists();
  const h = location.hash.slice(1);
  if(h && d.stocks[h]) show(h);
}).catch(() => {
  $("#date").textContent = "";
  $("#hint").textContent = "還沒有資料。到 GitHub 的 Actions 分頁手動執行一次「每日選股」，大約 5 分鐘後重新整理這頁。";
});
</script>
</body>
</html>

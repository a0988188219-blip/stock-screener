<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>阿珊的選股</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F4; --surface:#FFFFFF; --ink:#17202B; --muted:#5E6A78; --line:#D5DBE2;
  --rise:#D0342C; --fall:#13865A;
  --hold:#2B4C9B; --watch:#B7791F; --exit:#4A5361;
  --hold-bg:#E3E9F7; --watch-bg:#F7EDDA; --exit-bg:#E2E5EA;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12171E; --surface:#1B222C; --ink:#E7ECF2; --muted:#93A0AF; --line:#2C3542;
  --rise:#F0645B; --fall:#3DBB85; --hold:#8FA9F0; --watch:#E2AE4E; --exit:#AAB3C0;
  --hold-bg:#1E2A47; --watch-bg:#3A2E17; --exit-bg:#2A313B;
}}
:root[data-theme="dark"]{
  --paper:#12171E; --surface:#1B222C; --ink:#E7ECF2; --muted:#93A0AF; --line:#2C3542;
  --rise:#F0645B; --fall:#3DBB85; --hold:#8FA9F0; --watch:#E2AE4E; --exit:#AAB3C0;
  --hold-bg:#1E2A47; --watch-bg:#3A2E17; --exit-bg:#2A313B;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:16px;line-height:1.6;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
.wrap{max-width:580px;margin:0 auto;padding:20px 18px 48px}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
header h1{font-size:22px;font-weight:900;margin:0}
header small{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;padding:9px 0;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--hold);outline-offset:2px}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:0 18px;background:var(--ink);color:var(--paper);cursor:pointer}
.mine{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.mine button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.hint{color:var(--muted);font-size:14px;margin:14px 0 0}
.result{margin-top:26px}
.name{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.name h2{margin:0;font-size:20px;font-weight:700}
.add{font:inherit;font-size:14px;border:0;background:none;color:var(--hold);cursor:pointer;padding:4px 0;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.tags span{font-size:13px;background:var(--surface);border-radius:6px;padding:1px 8px;color:var(--muted)}
.price{display:flex;align-items:baseline;gap:12px;margin:4px 0 14px}
.price b{font-size:34px;font-weight:700}
.up{color:var(--rise)} .down{color:var(--fall)}
.verdict{border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.verdict .word{font-size:44px;font-weight:900;line-height:1.05;grid-row:span 2}
.verdict p{margin:0;font-weight:500}
.verdict small{color:var(--muted);font-size:13px}
.v-hold{background:var(--hold-bg)} .v-hold .word{color:var(--hold)}
.v-watch{background:var(--watch-bg)} .v-watch .word{color:var(--watch)}
.v-exit{background:var(--exit-bg)} .v-exit .word{color:var(--exit)}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 0}
.four div{background:var(--surface);border-radius:10px;padding:8px 4px;text-align:center;font-size:14px}
.four b{display:block;font-size:13px;color:var(--muted);font-weight:500}
.f-good{color:var(--hold);font-weight:700} .f-neutral{color:var(--muted)} .f-bad{color:var(--watch);font-weight:700}
.plan{margin:14px 0 0;border:1.5px solid var(--hold);border-radius:14px;padding:12px 16px}
.plan h4{margin:0 0 6px;font-size:15px}
.plan .row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plan small{display:block;color:var(--muted);font-size:12px}
.plan b{font-size:17px}
.plan p{margin:8px 0 0;font-size:14px;color:var(--muted)}
.chart{margin:18px 0 6px;background:var(--surface);border-radius:14px;padding:10px 6px 4px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:2px 10px 8px}
.legend i{display:inline-block;width:16px;border-top:2px solid;margin-right:6px;vertical-align:4px}
.cost{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 6px;font-size:15px}
.cost input{width:110px;font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.cost output{font-weight:700}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 0}
.sec h4{margin:0;font-size:17px}
.checks{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--line)}
.checks li{display:grid;grid-template-columns:28px 4em 1fr;gap:4px;padding:11px 0;border-bottom:1px solid var(--line);align-items:start}
.ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900;color:var(--surface);margin-top:2px}
.s-good .ic{background:var(--hold)} .s-warn .ic{background:var(--watch)} .s-bad .ic{background:var(--exit)} .s-info .ic{background:var(--line);color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 0}
.facts div{background:var(--surface);border-radius:10px;padding:8px 10px}
.facts small{display:block;color:var(--muted);font-size:12px}
.news{list-style:none;margin:8px 0 0;padding:0}
.news li{padding:10px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:24px 1fr;gap:4px}
.news a{color:var(--ink);text-decoration:none}
.news small{display:block;color:var(--muted);font-size:13px}
.note{color:var(--muted);font-size:13px;margin:8px 0 0}
.note a{color:var(--hold)}
h3{font-size:17px;margin:28px 0 4px}
h3+p{color:var(--muted);font-size:14px;margin:0 0 8px}
.rot{background:var(--surface);border-radius:12px;padding:4px 14px;margin:8px 0}
.rot div{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.rot div:last-child{border-bottom:0}
.rot small{color:var(--muted);font-size:13px;text-align:right}
.pick{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:0;border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer}
.pick .top{display:flex;justify-content:space-between;gap:8px}
.pick .sub{font-size:14px;color:var(--muted);margin-top:2px}
.pick .lv{font-size:14px;margin-top:4px}
.empty{color:var(--muted);padding:6px 0}
footer{margin-top:36px;color:var(--muted);font-size:13px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.result{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>阿珊的選股</h1><small id="date">讀取中…</small></header>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="check">個股健檢</button>
    <button role="tab" aria-selected="false" data-tab="lists">今日名單</button>
  </div>

  <section id="tab-check">
    <form class="search" id="form">
      <input id="q" list="stocklist" inputmode="search" autocomplete="off" placeholder="輸入代號或名稱，例如 2330">
      <datalist id="stocklist"></datalist>
      <button class="btn" type="submit">健檢</button>
    </form>
    <div class="mine" id="mine"></div>
    <p class="hint" id="hint">輸入想看的股票。按「加入常看」會存在這支手機上；LINE 裡的持股請在 LINE 用「+代號」管理。</p>
    <div class="result" id="result" hidden></div>
  </section>

  <section id="tab-lists" hidden></section>

  <footer>規則算出的參考，不是買賣建議。進場前請對照 K 線圖，並確實執行停損。</footer>
</div>

<script>
const $ = s => document.querySelector(s);
const fmt = n => n == null ? "—" : Number(n).toLocaleString("zh-TW",{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = n => (n > 0 ? "+" : "") + Number(n).toFixed(1) + "%";
const cls = n => n > 0 ? "up" : n < 0 ? "down" : "";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const WORD = {hold:"續抱", watch:"留意", exit:"該檢討"};
const ICON = {good:"✓", warn:"!", bad:"✕", info:"–"};
const FW = {good:"好", neutral:"普通", bad:"有疑慮"};
const FI = {good:"✅", neutral:"➖", bad:"⚠️"};
const LISTNAME = {tangle:"🔥 糾結突破", general:"🚀 一般突破", pullback:"🔄 拉回支撐"};
const NEWS_IC = {pos:"📈", neg:"📉", neu:"📰"};
let IDX = null;
const cache = {};

const store = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};

async function loadStock(code){
  if(cache[code]) return cache[code];
  const r = await fetch(`s/${code}.json`, {cache:"no-store"});
  if(!r.ok) return null;
  return cache[code] = await r.json();
}

function findCode(q){
  q = q.trim(); if(!q) return null;
  const m = q.match(/^\d{4,6}[A-Z]?/); if(m && IDX.names[m[0]]) return m[0];
  for(const [c,v] of Object.entries(IDX.names)) if(v[0] === q) return c;
  for(const [c,v] of Object.entries(IDX.names)) if(v[0] && v[0].includes(q)) return c;
  return null;
}

function chart(s){
  const W=600, H=240, P={l:8, r:84, t:14, b:14};
  const series = [s.closes, s.ma20s, s.ma60s];
  const lv = [s.support, s.resistance, s.plan?.stop, s.plan?.target].filter(v => v != null);
  const all = series.flat().filter(v => v != null).concat(lv);
  let lo = Math.min(...all), hi = Math.max(...all);
  const pad = (hi-lo)*.06 || 1; lo -= pad; hi += pad;
  const n = s.closes.length;
  const x = i => P.l + i*(W-P.l-P.r)/(n-1);
  const y = v => P.t + (hi-v)*(H-P.t-P.b)/(hi-lo);
  const path = a => a.map((v,i) => v==null ? "" : `${i && a[i-1]!=null ? "L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const level = (v, color, label, dash) => v==null ? "" :
    `<line x1="${P.l}" x2="${W-P.r+4}" y1="${y(v)}" y2="${y(v)}" stroke="${color}" stroke-width="1.5" stroke-dasharray="${dash}"/>
     <text x="${W-P.r+8}" y="${y(v)+4}" font-size="12.5" fill="${color}" font-weight="700">${label} ${fmt(v)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="近 60 天股價、月線、季線、支撐壓力">
    <path d="${path(s.ma60s)}" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="2 3"/>
    <path d="${path(s.ma20s)}" fill="none" stroke="var(--muted)" stroke-width="1.5"/>
    ${level(s.resistance,"var(--rise)","壓力","6 5")}
    ${level(s.support,"var(--hold)","支撐","6 5")}
    ${s.plan ? level(s.plan.target,"var(--rise)","停利","2 3") + level(s.plan.stop,"var(--exit)","停損","2 3") : ""}
    <path d="${path(s.closes)}" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${x(n-1)}" cy="${y(s.closes[n-1])}" r="4.5" fill="var(--ink)"/>
  </svg>`;
}

const checksHTML = items => items.length ? `<ul class="checks">${items.map(c =>
  `<li class="s-${c.s}"><span class="ic">${ICON[c.s]}</span><b>${esc(c.t)}</b><span>${esc(c.d)}</span></li>`).join("")}</ul>` : "";

function costLine(s, cost){
  if(!cost) return "";
  const ret = (s.close/cost - 1)*100;
  const stop = s.plan?.stop ?? s.stop_ref;
  let t = `目前報酬 <span class="${cls(ret)}">${pct(ret)}</span>`;
  if(stop){ const r = (stop/cost-1)*100; t += `，到停損 ${fmt(stop)} 約 <span class="${cls(r)}">${pct(r)}</span>`; }
  return t;
}

async function show(code){
  const s = await loadStock(code);
  if(!s){ $("#hint").hidden = false; $("#hint").textContent = "這檔目前沒有資料。"; return; }
  location.hash = code;
  const mine = store.get("mine", []), costs = store.get("costs", {});
  const f = s.facets, v = f.fund.vals || {};
  const tags = [...(s.themes||[]), s.industry].filter(Boolean);
  const plan = s.plan ? `<div class="plan"><h4>${LISTNAME[s.pick.list]}${s.pick.day ? `（突破第 ${s.pick.day} 天）` : ""}</h4>
      <div class="row"><div><small>進場區</small><b>${fmt(s.plan.lo)}～${fmt(s.plan.hi)}</b></div>
      <div><small>停損</small><b>${fmt(s.plan.stop)}</b></div>
      <div><small>30 天停利（${esc(s.plan.tnote)}）</small><b>${fmt(s.plan.target)}</b></div></div>
      <p>${esc(s.plan.status)}${s.plan.rr ? `，報酬風險比 ${s.plan.rr.toFixed(1)}` : ""}</p></div>` : "";
  const fact = (k, val) => `<div><small>${k}</small><b>${val}</b></div>`;
  const q = encodeURIComponent((s.name||"") + " " + code);
  const notices = f.news.items.filter(i => i.t === "重大訊息");
  const newsList = (s.news||[]).map(n => `<li><span>${NEWS_IC[n.tag]}</span><span><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a><small>${esc(n.source)} ${esc(n.date)}</small></span></li>`).join("");

  $("#result").innerHTML = `
    <div class="name"><h2>${code} ${esc(s.name)}</h2>
      <button class="add" id="toggle">${mine.includes(code) ? "移出常看" : "＋ 加入常看"}</button></div>
    ${tags.length ? `<div class="tags">${tags.map(t => `<span>${esc(t)}</span>`).join("")}</div>` : ""}
    <div class="price"><b>${fmt(s.close)}</b><span class="${cls(s.chg)}">${pct(s.chg)}</span><small style="color:var(--muted)">${s.date}</small></div>
    <div class="verdict v-${s.verdict}"><span class="word">${WORD[s.verdict]}</span><p>${esc(s.summary)}</p>
      <small>${s.plan ? "停損 " + fmt(s.plan.stop) : s.stop_ref ? "停損參考：跌破 " + fmt(s.stop_ref) : ""}</small></div>
    <div class="four">${[["技術","tech"],["籌碼","chip"],["基本","fund"],["消息","news"]].map(([n,k]) =>
      `<div><b>${n}</b><span class="f-${f[k].v}">${FI[f[k].v]} ${FW[f[k].v]}</span></div>`).join("")}</div>
    ${plan}
    <div class="chart">${chart(s)}
      <div class="legend"><span><i style="border-color:var(--ink)"></i>股價</span><span><i style="border-color:var(--muted)"></i>月線</span>
      <span><i style="border-color:var(--muted);border-top-style:dotted"></i>季線</span>
      <span><i style="border-color:var(--hold);border-top-style:dashed"></i>支撐</span><span><i style="border-color:var(--rise);border-top-style:dashed"></i>壓力</span></div></div>
    <label class="cost">成本價 <input id="cost" type="number" inputmode="decimal" step="0.01" value="${costs[code] ?? ""}" placeholder="選填">
      <output id="costOut">${costLine(s, costs[code])}</output></label>
    <div class="sec"><h4>📊 技術面</h4><span class="f-${f.tech.v}">${FI[f.tech.v]} ${FW[f.tech.v]}</span></div>${checksHTML(f.tech.items)}
    <div class="sec"><h4>👥 籌碼面</h4><span class="f-${f.chip.v}">${FI[f.chip.v]} ${FW[f.chip.v]}</span></div>${checksHTML(f.chip.items)}
    <div class="sec"><h4>💰 基本面</h4><span class="f-${f.fund.v}">${FI[f.fund.v]} ${FW[f.fund.v]}</span></div>
    ${f.fund.items.length ? `<div class="facts">${fact("近四季 EPS", v.eps != null ? v.eps.toFixed(2) : "—")}${fact("本益比", v.pe != null ? v.pe.toFixed(1) : "—")}${fact("同業本益比", v.ind_pe != null ? v.ind_pe.toFixed(1) : "—")}
      ${fact("ROE", v.roe != null ? v.roe.toFixed(1)+"%" : "—")}${fact("殖利率", v.yield != null ? v.yield.toFixed(1)+"%" : "—")}${fact("同業換算價", v.fair != null ? fmt(v.fair) : "—")}</div>
      ${checksHTML(f.fund.items)}<p class="note">同業換算價＝近四季 EPS × 同產業本益比中位數，只是估值參考，不是目標價。</p>`
      : `<p class="note">沒有基本面資料（上櫃股暫不支援）。</p>`}
    <div class="sec"><h4>🗞 消息面</h4><span class="f-${f.news.v}">${FI[f.news.v]} ${FW[f.news.v]}</span></div>
    ${notices.length || newsList ? `<ul class="news">${notices.map(n => `<li><span>${n.s === "bad" ? "⚠️" : "📢"}</span><span>${esc(n.d)}<small>公司重大訊息</small></span></li>`).join("")}${newsList}</ul>`
      : `<p class="note">名單股和持股才會每天抓新聞；LINE 輸入代號可以查最新消息。</p>`}
    <p class="note">📈📉 是標題關鍵字粗判，一定要點進去看內容。<a href="https://news.google.com/search?q=${q}&hl=zh-TW&gl=TW&ceid=TW:zh-Hant" target="_blank" rel="noopener">在 Google 新聞看更多</a></p>`;
  $("#result").hidden = false; $("#hint").hidden = true;
  $("#toggle").onclick = () => {
    let m = store.get("mine", []);
    m = m.includes(code) ? m.filter(c => c !== code) : [...m, code];
    store.set("mine", m); renderMine(); show(code);
  };
  $("#cost").oninput = e => {
    const val = parseFloat(e.target.value), c = store.get("costs", {});
    if(val > 0) c[code] = val; else delete c[code];
    store.set("costs", c);
    $("#costOut").innerHTML = costLine(s, val > 0 ? val : null);
  };
}

function renderMine(){
  const mine = store.get("mine", []).filter(c => IDX.names[c]);
  $("#mine").innerHTML = mine.map(c => `<button data-code="${c}"><span class="dot" style="background:var(--${IDX.names[c][1]})"></span>${c} ${esc(IDX.names[c][0])}</button>`).join("");
  $("#mine").querySelectorAll("button").forEach(b => b.onclick = () => show(b.dataset.code));
}

function rotHTML(arr){
  if(!arr.length) return '<p class="empty">今天沒有明顯變化。</p>';
  return `<div class="rot">${arr.map(r => `<div><span>${esc(r.name)}<small style="margin-left:6px">${r.kind}</small></span>
    <small><span class="${cls(r.chg)}">${pct(r.chg)}</span>　成交值 ${r.ratio != null ? r.ratio.toFixed(1) : "—"} 倍${r.inst != null ? `　法人 ${r.inst > 0 ? "+" : ""}${r.inst.toFixed(1)} 億` : ""}</small></div>`).join("")}</div>`;
}

function pickHTML(p){
  const fs = ["tech","chip","fund","news"].map((k,i) => `${["技術","籌碼","基本","消息"][i]}${FI[p.facets[k]]}`).join(" ");
  return `<button class="pick" data-code="${p.code}">
    <div class="top"><b>${p.code} ${esc(p.name)}</b><span>${fmt(p.close)} <span class="${cls(p.chg)}">${pct(p.chg)}</span></span></div>
    <div class="sub">${esc(p.themes[0] || p.industry || "")}${p.day ? `　突破第 ${p.day} 天` : ""}　${fs}</div>
    <div class="lv">進場 ${fmt(p.plan.lo)}～${fmt(p.plan.hi)}｜停損 ${fmt(p.plan.stop)}｜停利 ${fmt(p.plan.target)}</div></button>`;
}

function renderLists(){
  const L = IDX.lists, R = IDX.rotation;
  const sec = (k, desc) => `<h3>${LISTNAME[k]}</h3><p>${desc}</p>${L[k].length ? L[k].map(pickHTML).join("") : '<p class="empty">今天沒有符合的股票。</p>'}`;
  $("#tab-lists").innerHTML = `
    <h3>💸 資金流入</h3><p>成交值比平常多、整體上漲的產業和題材。</p>${rotHTML(R.inflow)}
    <h3>🧊 資金流出</h3><p>持股在這些族群要多留意。</p>${rotHTML(R.outflow)}
    ${sec("tangle","均線糾結、盤整後帶量剛突破，還沒漲一大段。")}
    ${sec("general","帶量突破盤整或 20 日高點，已排除過熱和乖離太大的。")}
    ${sec("pullback","多頭趨勢中拉回到支撐，量縮止跌、RSI 守住。")}`;
  $("#tab-lists").querySelectorAll(".pick").forEach(b => b.onclick = () => { switchTab("check"); show(b.dataset.code); scrollTo(0,0); });
}

function switchTab(t){
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  $("#tab-check").hidden = t !== "check"; $("#tab-lists").hidden = t !== "lists";
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => switchTab(b.dataset.tab));

$("#form").onsubmit = e => {
  e.preventDefault();
  const code = findCode($("#q").value);
  if(code){ show(code); $("#q").value = ""; $("#q").blur(); }
  else { $("#result").hidden = true; $("#hint").hidden = false;
    $("#hint").textContent = "找不到這檔。請輸入上市股票代號或名稱；上櫃股要先在 LINE 用「+代號」加入持股，隔天才查得到。"; }
};

fetch("index.json", {cache:"no-store"}).then(r => { if(!r.ok) throw 0; return r.json() }).then(d => {
  IDX = d;
  $("#date").textContent = `資料日期 ${d.date.slice(5).replace("-","/")}`;
  $("#stocklist").innerHTML = Object.entries(d.names).map(([c,v]) => `<option value="${c} ${esc(v[0])}">`).join("");
  renderMine(); renderLists();
  const h = location.hash.slice(1);
  if(h && d.names[h]) show(h);
}).catch(() => {
  $("#date").textContent = "";
  $("#hint").textContent = "還沒有資料。到 GitHub 的 Actions 手動執行一次「每日選股」，大約 10 分鐘後重新整理。";
});
</script>
</body>
</html>

name: 每日選股

on:
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python screener.py
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          HOLDINGS: ${{ vars.HOLDINGS }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: 群發盤後精選給 LINE 好友
        if: github.event_name == 'schedule'
        run: |
          sleep 15
          curl -sS -X POST "${WORKER_URL}/broadcast?key=${SYNC_KEY}"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}